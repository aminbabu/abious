name: Deploy to Contabo VPS

on:
  push:
    branches:
      - main

# Ensure only one deployment runs at a time
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  lint-and-validate:
    name: Lint & Pre-flight Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Linters
        run: pnpm --filter "*" run lint

  deploy-to-vps:
    name: Deploy to Contabo
    needs: lint-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONTABO_HOST }}
          username: ${{ secrets.CONTABO_USER }}
          key: ${{ secrets.CONTABO_SSH_KEY }}
          passphrase: ${{ secrets.CONTABO_SSH_PASSPHRASE }}
          port: ${{ secrets.CONTABO_PORT || 22 }}
          script_stop: true
          envs: CONTABO_APP_DIR
          script: |
            TARGET_DIR="${{ secrets.CONTABO_APP_DIR || '~/abious' }}"
            # Expand tilde if provided
            TARGET_DIR="${TARGET_DIR/#\~/$HOME}"
            
            echo "--> Navigating to application directory: $TARGET_DIR"
            cd "$TARGET_DIR"
            
            # Execute deployment script on the server
            # Environment variables (.env.production) already exist solely on the server
            bash deploy/deploy.sh
