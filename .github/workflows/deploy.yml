name: Deploy Astro Portfolio

on:
  push:
    branches:
      - archive/astro
  workflow_dispatch:

concurrency:
  group: astro-static-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          set -eu

          # Create ~/.ssh only if it does not exist.
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          SSH_KEY="$HOME/.ssh/aminbabu_deploy_key"

          # Create a dedicated deployment key without overwriting existing keys.
          printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          # Use a verified, pinned server host key in production.
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" \
            >> "$HOME/.ssh/known_hosts"

          ssh -i "$SSH_KEY" \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -e

          cd '${{ secrets.SERVER_APP_DIR }}'

          git fetch origin archive/astro
          git checkout archive/astro
          git pull --ff-only origin archive/astro

          npm install --no-package-lock
          npm run build

          # serve is only needed at runtime for pm2; keep the git tree clean
          if [ ! -f ./node_modules/serve/build/main.js ]; then
            npm install serve --no-package-lock --no-save
          fi

          if pm2 describe aminbabu-portfolio >/dev/null 2>&1; then
            pm2 restart aminbabu-portfolio
          else
            pm2 start ./node_modules/serve/build/main.js \
              --name "aminbabu-portfolio" -- -s dist -l 8006
          fi

          pm2 save
          REMOTE

          # Remove only the dedicated deployment key.
          rm -f "$SSH_KEY"
