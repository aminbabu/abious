name: Deploy Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy-aminbabu
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy aminbabu.com
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate required secrets
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_APP_DIR: ${{ secrets.SERVER_APP_DIR }}
        run: |
          set -eu
          missing=0
          for name in SERVER_HOST SERVER_USER SERVER_PORT SERVER_SSH_KEY SERVER_APP_DIR; do
            if [ -z "${!name}" ]; then
              echo "Missing secret: $name"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Deploy over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -eu

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          SSH_KEY="$HOME/.ssh/aminbabu_deploy_key"
          printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" >> "$HOME/.ssh/known_hosts"

          ssh -i "$SSH_KEY" \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            -o IdentitiesOnly=yes \
            -o ServerAliveInterval=30 \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail

          cd '${{ secrets.SERVER_APP_DIR }}'

          export DEPLOY_BRANCH=main
          # Production updates keep locked ports from .env.production
          bash deploy/deploy.sh
          REMOTE

          rm -f "$SSH_KEY"
