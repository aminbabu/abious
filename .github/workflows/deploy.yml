name: Deploy Portfolio

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server over SSH
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server over SSH
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_PORT: ${{ secrets.SERVER_PORT }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          SERVER_APP_DIR_MONOREPO: ${{ secrets.SERVER_APP_DIR_MONOREPO }}
        run: |
          set -eu

          # Create ~/.ssh only if it does not exist.
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          SSH_KEY="$HOME/.ssh/aminbabu_deploy_key"

          # Create a dedicated deployment key without overwriting existing keys.
          printf '%s\n' "$SERVER_SSH_KEY" > "$SSH_KEY"
          chmod 600 "$SSH_KEY"

          # Use a verified, pinned server host key in production.
          ssh-keyscan -p "$SERVER_PORT" "$SERVER_HOST" \
            >> "$HOME/.ssh/known_hosts"

          ssh -i "$SSH_KEY" \
            -p "$SERVER_PORT" \
            -o StrictHostKeyChecking=yes \
            "$SERVER_USER@$SERVER_HOST" 'bash -se' <<'REMOTE'
          set -e

          cd '${{ secrets.SERVER_APP_DIR_MONOREPO }}'

          export DEPLOY_BRANCH='${{ github.ref_name }}'

          git fetch origin "$DEPLOY_BRANCH"
          git checkout "$DEPLOY_BRANCH"
          git pull --ff-only origin "$DEPLOY_BRANCH"

          # Monorepo: npm workspaces + PM2 (CloudPanel)
          bash deploy/deploy.sh
          REMOTE

          # Remove only the dedicated deployment key.
          rm -f "$SSH_KEY"
