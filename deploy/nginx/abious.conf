# ==============================================================================
# Nginx Configuration for Abious
# Frontend: yourdomain.com
# Backend API: api.yourdomain.com
# ==============================================================================

# API Proxy (api.yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment once certbot SSL is issued)
    # return 301 https://$host$request_uri;

    client_max_body_size 15M;

    # Uploads direct serving or caching
    location /uploads/ {
        alias /var/www/abious/apps/api/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }

    # API endpoints & Better Auth reverse proxy
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep timeouts reasonable
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# Web Application Proxy (yourdomain.com)
server {
    listen 80;
    listen [::]:80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP to HTTPS (uncomment once certbot SSL is issued)
    # return 301 https://$host$request_uri;

    client_max_body_size 10M;

    # Static assets caching from SolidStart / Nitro client bundle
    location /_build/ {
        alias /var/www/abious/apps/web/.output/public/_build/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }
}
